<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Flash Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #f3f1fd;
        --surface: #ffffff;
        --ink: #2a1b4a;
        --ink-soft: #4b3b73;
        --muted: #8b84ab;
        --line: #e8e4f7;
        --primary: #6d28d9;
        --primary-deep: #4c1d95;
        --magenta: #b4189b;
        --danger: #e0245e;
        --ok: #22a06b;
        --warn: #d98600;
        --shadow-sm: 0 2px 10px rgba(76, 29, 149, 0.06);
        --shadow-md: 0 14px 40px rgba(76, 29, 149, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 26px 26px 40px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 100vh;
      }

      /* ---------- page head ---------- */

      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }

      .page-head h1 {
        margin: 0;
        font-family: 'Baloo 2', 'Nunito', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 0.2px;
      }

      .api-field {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 13px;
        color: var(--muted);
        box-shadow: var(--shadow-sm);
      }

      .api-field input {
        border: none;
        outline: none;
        background: transparent;
        font: inherit;
        color: var(--ink);
        width: 200px;
      }

      /* ---------- console panel ---------- */

      .panel {
        background: var(--surface);
        border-radius: 20px;
        padding: 28px;
        box-shadow: var(--shadow-md);
      }

      .field-label {
        display: block;
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 10px;
      }

      .field-label .req {
        color: var(--danger);
      }

      .topic-input {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 450px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 16px;
        transition: border-color 0.16s, box-shadow 0.16s;
      }

      .topic-input:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.1);
      }

      .topic-input svg {
        flex: 0 0 auto;
        color: var(--muted);
      }

      .topic-input input {
        border: none;
        outline: none;
        font: inherit;
        font-size: 15px;
        width: 100%;
        color: var(--ink);
        background: transparent;
      }

      .topic-input input::placeholder {
        color: #a9a2c4;
      }

      .age-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(196px, 216px));
        gap: 14px;
        margin: 22px 0 0;
        max-width: 460px;
      }

      .age-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        text-align: left;
        transition: border-color 0.16s, color 0.16s, background 0.16s;
      }

      .age-pill .radio {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid #d9d3ee;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        color: transparent;
      }

      .age-pill[aria-checked='true'] {
        border-color: var(--primary);
        color: var(--primary);
        background: #faf7ff;
      }

      .age-pill[aria-checked='true'] .radio {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .extra-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
      }

      .extra-row select {
        font: inherit;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        background: #fff;
        outline: none;
      }

      .extra-row select#templateSelect {
        min-width: 260px;
        max-width: 420px;
      }

      .actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      .btn-outline {
        min-width: 218px;
        padding: 14px 26px;
        border-radius: 12px;
        border: 1.5px solid var(--primary);
        color: var(--primary);
        font-weight: 700;
        font-size: 16px;
        background: #fff;
        transition: background 0.16s;
      }

      .btn-outline:hover:not(:disabled) {
        background: #f7f2ff;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        color: #fff;
        background: linear-gradient(100deg, var(--magenta), var(--primary) 60%, var(--primary-deep));
        box-shadow: 0 10px 26px rgba(109, 40, 217, 0.28);
        transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 14px 30px rgba(109, 40, 217, 0.36);
      }

      .btn-primary:disabled {
        opacity: 0.4;
        box-shadow: none;
      }

      .btn-soft {
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .btn-soft:hover:not(:disabled) {
        border-color: #cfc7ea;
        background: #faf8ff;
      }

      .btn-soft:disabled {
        opacity: 0.5;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--muted);
      }

      .chip {
        padding: 7px 14px;
        border-radius: 999px;
        background: #f5f2ff;
        border: 1px solid #eae4fb;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .chip:hover {
        background: #ede6ff;
      }

      /* ---------- banners ---------- */

      .banner {
        display: none;
        gap: 10px;
        margin-top: 18px;
        padding: 13px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      .banner.show {
        display: flex;
      }

      .banner.error {
        background: #fff1f4;
        border: 1px solid #f8ccd8;
        color: #a01340;
      }

      .banner.warn {
        background: #fff8ec;
        border: 1px solid #f6e0bb;
        color: #8a5a06;
      }

      .banner code {
        font-size: 12.5px;
        opacity: 0.85;
      }

      /* ---------- results ---------- */

      .results {
        background: var(--surface);
        border-radius: 20px;
        padding: 22px 22px 8px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
      }

      .summary {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
      }

      .summary.show {
        display: flex;
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        padding: 6px 13px;
        border-radius: 999px;
        background: #f5f2ff;
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 600;
      }

      .pill b {
        color: var(--ink);
      }

      .bulk {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        gap: 26px 22px;
      }

      .tile {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tile-actions {
        display: flex;
        gap: 14px;
        align-items: center;
        padding-left: 2px;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
        transition: color 0.16s, background 0.16s;
      }

      .icon-btn:hover:not(:disabled) {
        background: #f5f2ff;
        color: var(--primary);
      }

      .icon-btn.fav {
        color: #f0aec2;
      }

      .icon-btn.fav[aria-pressed='true'] {
        color: var(--danger);
      }

      .icon-btn.fav[aria-pressed='true'] svg {
        fill: currentColor;
      }

      /* ---------- skeleton ---------- */

      .skeleton {
        aspect-ratio: 5 / 7;
        border-radius: 18px;
        background: linear-gradient(100deg, #f1eefb 30%, #e6e0f7 50%, #f1eefb 70%);
        background-size: 220% 100%;
        animation: shimmer 1.2s infinite linear;
      }

      @keyframes shimmer {
        from {
          background-position: 160% 0;
        }
        to {
          background-position: -60% 0;
        }
      }

      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
      }

      .empty h2 {
        font-family: 'Baloo 2', sans-serif;
        margin: 0 0 6px;
        font-size: 22px;
        color: var(--ink);
      }

      .empty p {
        margin: 0;
        font-size: 14px;
      }

      /* ---------- footer / pagination ---------- */

      .table-foot {
        margin-top: auto;
        padding: 16px 2px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
      }

      .rows-per-page {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .rows-per-page button {
        font-weight: 700;
        color: var(--muted);
      }

      .rows-per-page button[aria-current='true'] {
        color: var(--primary);
      }

      .pager {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pager .page-num {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        color: var(--ink-soft);
      }

      .pager .page-num[aria-current='true'] {
        background: var(--primary);
        color: #fff;
      }

      .pager .arrow {
        color: var(--ink-soft);
        display: grid;
        place-items: center;
      }

      .pager button:disabled {
        opacity: 0.35;
      }

      /* =========================================================
         THE FLASH CARD (UNO-card proportions, fully dynamic)
         All internal sizing is expressed in cqw so a single markup
         tree scales from a 196px thumbnail to a 1000px export.
         ========================================================= */

      /* the outer element only establishes the query container: an element
         cannot resolve its own cqw units against itself */
      .uno {
        container-type: inline-size;
        position: relative;
        aspect-ratio: 5 / 7;
        width: 100%;
        display: flex;
        border-radius: 22px;
        box-shadow: 0 10px 26px rgba(42, 27, 74, 0.16);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .uno-frame {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        background: var(--frame);
        border-radius: 5.4cqw;
        padding: 5.2cqw;
        overflow: hidden;
      }

      .tile .uno {
        cursor: zoom-in;
      }

      .tile .uno:hover,
      .tile .uno:focus-visible {
        transform: translateY(-5px);
        box-shadow: 0 18px 40px rgba(42, 27, 74, 0.24);
        outline: none;
      }

      /* dashed keyline that sits on the coloured frame */
      .uno-frame::before {
        content: '';
        position: absolute;
        inset: 2.1cqw;
        border: 0.5cqw dashed var(--dash);
        border-radius: 4cqw;
        pointer-events: none;
      }

      .uno-sheet {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        background: #fff;
        border-radius: 3.4cqw;
        padding: 3.6cqw 3.8cqw 4.2cqw;
        display: flex;
        flex-direction: column;
        gap: 2cqw;
        overflow: hidden;
      }

      /* ---- header ---- */

      .uno-top {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 2cqw;
        flex: 0 0 auto;
      }

      .uno-cat {
        font-size: 3.5cqw;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #3a3a4d;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .uno-logo {
        display: inline-flex;
        align-items: flex-end;
        gap: 0.5cqw;
        flex: 0 0 auto;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        line-height: 1;
      }

      .uno-logo span {
        font-size: 4.6cqw;
        padding: 0.5cqw 0.9cqw;
        border-radius: 1.2cqw;
        color: #fff;
      }

      .uno-logo span:nth-child(1) {
        background: #5b1d9c;
        transform: rotate(-6deg);
      }

      .uno-logo span:nth-child(2) {
        background: #f5b700;
        color: #3a2a00;
        transform: translateY(-0.6cqw);
      }

      .uno-logo span:nth-child(3) {
        background: #e0245e;
        transform: rotate(7deg);
      }

      /* ---- main / figures ---- */

      .uno-main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.6cqw;
        position: relative;
      }

      .uno-figure {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* images sit flush: no frame, no outline, never cropped */
      .uno-figure img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        object-position: center;
        border: 0;
        outline: 0;
        background: none;
      }

      .uno-main.cover .uno-figure img {
        object-fit: cover;
        border-radius: 2cqw;
      }

      .fig-fallback {
        text-align: center;
        color: #a8a2c0;
        padding: 3cqw;
        display: grid;
        gap: 1.4cqw;
        place-items: center;
      }

      .fig-fallback svg {
        width: 14cqw;
        height: 14cqw;
        opacity: 0.55;
      }

      .fig-fallback small {
        font-size: 2.9cqw;
        line-height: 1.4;
        max-width: 60cqw;
        display: block;
      }

      /* hero glyph (letter / number / word being taught) */
      .uno-hero {
        flex: 0 0 auto;
        text-align: center;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 38cqw;
        line-height: 0.98;
        color: var(--frame);
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .uno-hero.long {
        font-size: 16cqw;
      }

      /* duo layout: two labelled figures side by side */
      .uno-cells {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        gap: 2cqw;
      }

      .uno-cells.duo {
        grid-template-columns: 1fr 1fr;
      }

      .uno-cells.quad {
        position: relative;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2.4cqw;
      }

      .uno-cell {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1cqw;
      }

      .uno-cell .uno-figure {
        flex: 1 1 auto;
      }

      .cell-label {
        flex: 0 0 auto;
        text-align: center;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 5.2cqw;
        line-height: 1.1;
        color: #33333f;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .uno-cells.quad .cell-label {
        font-size: 4.6cqw;
      }

      /* dashed cross dividers for the 4-up layout */
      .uno-cells.quad::before,
      .uno-cells.quad::after {
        content: '';
        position: absolute;
        pointer-events: none;
      }

      .uno-cells.quad::before {
        left: 50%;
        top: 0;
        bottom: 0;
        border-left: 0.45cqw dashed #d7d3e6;
      }

      .uno-cells.quad::after {
        top: 50%;
        left: 0;
        right: 0;
        border-top: 0.45cqw dashed #d7d3e6;
      }

      /* centre bubble that overlaps the 4-up grid */
      .uno-bubble {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        min-width: 30cqw;
        padding: 3.4cqw 5cqw;
        border-radius: 50%;
        background: var(--bubble);
        color: #fff;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 12cqw;
        line-height: 1;
        text-align: center;
        display: grid;
        place-items: center;
        box-shadow: 0 1.4cqw 3cqw rgba(0, 0, 0, 0.12);
      }

      /* counting dots (number-concept templates) — max 5 per row like the
         printed reference cards, so 8 reads as 5 + 3 */
      .uno-dots {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 1.8cqw;
        padding-top: 0.6cqw;
        margin: 0 auto;
        max-width: 61cqw;
      }

      .uno-dots i {
        width: 10.4cqw;
        height: 10.4cqw;
        border-radius: 50%;
        background: var(--frame);
        display: block;
      }

      /* 2x3 sequence grid (alphabet / number sequences, sight words) */
      .grid-2x3 {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 1fr;
        gap: 2.4cqw;
        align-content: center;
      }

      .grid-2x3-cell {
        display: grid;
        place-items: center;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 12cqw;
        color: #33333f;
        background: var(--tint, #f5f2ff);
        border-radius: 3cqw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .grid-2x3-cell.blank {
        color: var(--frame-ink, var(--primary));
        border: 0.5cqw dashed var(--frame, var(--primary));
        background: #fff;
      }

      /* multi-row image+label pairing (e.g. matching pairs list) */
      .layout-pair-list {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.6cqw;
        overflow: hidden;
      }

      .layout-pair-row {
        flex: 1 1 0;
        min-height: 0;
      }

      /* blank handwriting box (e.g. counting-objects answer slot) */
      .u-answerbox {
        flex: 0 0 auto;
        min-height: 13cqw;
        border: 0.6cqw dashed var(--frame);
        border-radius: 2.4cqw;
        background: #fff;
      }

      /* ---- text stack ---- */

      .uno-text {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.4cqw;
        text-align: center;
      }

      .u-caption {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 8.6cqw;
        line-height: 1.05;
        color: #2f2f3d;
        text-wrap: balance;
      }

      .u-caption.long {
        font-size: 6.2cqw;
      }

      .u-subtitle {
        font-size: 4cqw;
        font-weight: 700;
        color: #6b6489;
      }

      .u-sentence {
        font-size: 3.9cqw;
        line-height: 1.42;
        color: #4e4a63;
        text-wrap: pretty;
      }

      .u-pron {
        font-size: 3.6cqw;
        letter-spacing: 0.06em;
        color: #7d76a0;
        font-weight: 700;
      }

      .u-note {
        display: flex;
        gap: 1.4cqw;
        align-items: flex-start;
        text-align: left;
        padding: 2cqw 2.4cqw;
        border-radius: 2.4cqw;
        font-size: 3.5cqw;
        line-height: 1.4;
        background: var(--tint);
        color: #3d3552;
      }

      .u-note .tag {
        flex: 0 0 auto;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 3.2cqw;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--frame-ink);
        padding-top: 0.3cqw;
      }

      .u-note.q {
        font-weight: 700;
      }

      .u-badge {
        align-self: center;
        padding: 1.2cqw 3.4cqw;
        border-radius: 999px;
        background: var(--frame);
        color: var(--frame-ink);
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 3.6cqw;
      }

      .u-footer {
        font-size: 3cqw;
        color: #9a94b3;
      }

      /* offscreen export stage */
      .export-stage {
        position: fixed;
        left: 0;
        top: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: -1;
        overflow: hidden;
      }

      .export-stage .uno {
        box-shadow: none;
      }

      /* ---------- modal ---------- */

      .modal {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        padding: 30px;
        overflow: auto;
        background: rgba(42, 27, 74, 0.55);
        backdrop-filter: blur(6px);
      }

      .modal.show {
        display: grid;
        place-items: center;
      }

      .modal-inner {
        width: min(1080px, 100%);
        display: grid;
        grid-template-columns: minmax(300px, 440px) 1fr;
        gap: 26px;
        align-items: start;
      }

      @media (max-width: 880px) {
        .modal-inner {
          grid-template-columns: 1fr;
        }
      }

      .modal-card .uno {
        cursor: default;
      }

      .modal-side {
        background: #fff;
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow-md);
      }

      .modal-side h3 {
        font-family: 'Baloo 2', sans-serif;
        margin: 0 0 2px;
        font-size: 21px;
      }

      .modal-side .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 18px;
      }

      .kv {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px 12px;
        font-size: 13px;
        margin: 0 0 18px;
      }

      .kv dt {
        color: var(--muted);
        font-weight: 600;
      }

      .kv dd {
        margin: 0;
        word-break: break-word;
        color: var(--ink);
      }

      .comp-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 20px;
      }

      .comp-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        padding: 8px 11px;
        border-radius: 10px;
        background: #f7f5ff;
      }

      .comp-row code {
        color: var(--ink-soft);
      }

      .comp-row .type {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--ok);
      }

      .dot.blank {
        background: var(--warn);
      }

      .modal-nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .modal-close {
        position: fixed;
        top: 18px;
        right: 22px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-md);
      }

      /* ---------- toast ---------- */

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 26px);
        padding: 12px 22px;
        border-radius: 999px;
        background: #2a1b4a;
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        display: inline-block;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- layout engine (configuration-driven) ---------- */

      .layout-root {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 2cqw;
      }

      .layout-root.horizontal {
        flex-direction: row;
      }

      .layout-root.two-column {
        gap: 2cqw;
      }

      .layout-root.two-column .layout-row {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2cqw;
      }

      .layout-root.grid .layout-region[data-region-id='body'] .uno-cells {
        flex: 1 1 auto;
        min-height: 0;
      }

      .layout-root.overlay .layout-region[data-region-id='body'] {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .layout-root.overlay .layout-region[data-region-id='overlay'] {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }

      .layout-root.split .layout-split {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2cqw;
      }

      .layout-region {
        display: flex;
        min-width: 0;
      }

      .layout-region[data-region-id='header'] {
        flex: 0 0 auto;
        align-items: center;
        justify-content: flex-end;
        gap: 2cqw;
      }

      .layout-region[data-region-id='body'] {
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        gap: 1.6cqw;
      }

      .layout-region[data-region-id='footer'],
      .layout-region[data-region-id='bottom'] {
        flex: 0 0 auto;
        flex-direction: column;
        gap: 1.4cqw;
        text-align: center;
      }

      .layout-region[data-region-id='left'],
      .layout-region[data-region-id='right'] {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        gap: 1cqw;
      }

      .layout-region.hidden {
        display: none !important;
      }

      .comp-placeholder {
        padding: 2cqw 2.4cqw;
        border-radius: 2.4cqw;
        background: #f7f5ff;
        color: #8b84ab;
        font-size: 3.2cqw;
        text-align: center;
      }

      .comp-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2cqw;
      }

      .comp-chip {
        padding: 1.2cqw 3cqw;
        border-radius: 999px;
        background: var(--tint);
        color: var(--frame-ink);
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 3.6cqw;
      }

      .comp-options {
        display: flex;
        flex-direction: column;
        gap: 1cqw;
        text-align: left;
      }

      .comp-option {
        padding: 1.4cqw 2cqw;
        border-radius: 2cqw;
        background: var(--tint);
        font-size: 3.6cqw;
        line-height: 1.35;
        color: #3d3552;
      }

      [contenteditable='true'] {
        outline: none;
        cursor: text;
      }

      [contenteditable='true']:focus {
        box-shadow: 0 0 0 0.4cqw rgba(109, 40, 217, 0.18);
        border-radius: 1.2cqw;
      }

    </style>
  </head>
  <body>
    <main class="main">
      <header class="page-head">
        <h1>AI Flash Cards</h1>
        <div class="api-field">
          <label for="apiBase">API</label>
          <input id="apiBase" placeholder="http://localhost:3000" />
        </div>
      </header>

      <section class="panel">
        <label class="field-label" for="query">Today&rsquo;s learning topic</label>
        <div class="topic-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          <input id="query" placeholder="e.g My body Parts, Healthy Food, Animals" value="Generate flashcards on vegetables" />
        </div>

        <label class="field-label" style="margin-top: 24px" id="ageLabel">
          Select age group<span class="req">*</span>
        </label>
        <div class="age-grid" role="radiogroup" aria-labelledby="ageLabel" id="ageGroup">
          <button class="age-pill" role="radio" aria-checked="false" data-age="2-3">
            <span class="radio" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
            </span>
            2-3 years (FS 0)
          </button>
          <button class="age-pill" role="radio" aria-checked="true" data-age="3-4">
            <span class="radio" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
            </span>
            3-4 years (FS 1)
          </button>
          <button class="age-pill" role="radio" aria-checked="false" data-age="4-5">
            <span class="radio" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
            </span>
            4-5 years (FS 2)
          </button>
        </div>

        <div class="extra-row">
          <label for="templateSelect">Template</label>
          <select id="templateSelect">
            <option value="">Auto — no template selected</option>
          </select>
        </div>

        <div class="extra-row">
          <label for="count">Number of cards</label>
          <select id="count">
            <option selected>1</option>
            <option>3</option>
            <!-- <option>5</option>
            <option>8</option>
            <option>10</option>
            <option>12</option>
            <option>15</option>
            <option>20</option> -->
          </select>
        </div>

        <div class="actions">
          <button class="btn-outline" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="generateBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 4V2m0 20v-2M8 9l-6 6 3 3 6-6M13.5 6.5 17 3l4 4-3.5 3.5M19 15h2M4 5h2" />
            </svg>
            Generate Flash Cards
          </button>
        </div>

        <div class="chips">
          <span>Try:</span>
          <button class="chip" data-q="Generate flashcards on vegetables" data-a="3-4">Vegetables</button>
          <button class="chip" data-q="Teach animal names to toddlers" data-a="2-3">Animals</button>
          <button class="chip" data-q="Letters and beginning sounds" data-a="3-4">Letters</button>
          <button class="chip" data-q="Numbers and counting to ten" data-a="4-5">Numbers</button>
          <button class="chip" data-q="2D and 3D shapes around us" data-a="4-5">Shapes</button>
        </div>

        <div class="banner error" id="errorBanner"></div>
        <div class="banner warn" id="warnBanner"></div>
      </section>

      <section class="results">
        <div class="summary" id="summary">
          <div class="pills" id="metaPills"></div>
          <div class="bulk">
            <button class="btn-soft" id="downloadAllPng">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16" /></svg>
              All as PNG
            </button>
            <button class="btn-soft" id="downloadAllPdf">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16" /></svg>
              All as PDF
            </button>
          </div>
        </div>

        <div class="grid" id="grid"></div>

        <div class="empty" id="empty">
          <h2>No flash cards yet</h2>
          <p>Add a learning topic, pick an age group, then generate.</p>
        </div>

        <div class="table-foot">
          <div class="rows-per-page" id="rowsPerPage">
            <span>Row per page:</span>
            <button aria-current="true" data-size="0">default</button>
            <button data-size="10">10</button>
            <button data-size="20">20</button>
            <button data-size="50">50</button>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </section>
    </main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Flash card preview">
      <button class="modal-close" id="modalClose" aria-label="Close preview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
      <div class="modal-inner">
        <div class="modal-card" id="modalCard"></div>
        <aside class="modal-side">
          <h3 id="modalTitle">Card</h3>
          <div class="sub" id="modalSub"></div>
          <dl class="kv" id="modalKv"></dl>
          <div class="comp-list" id="modalComps"></div>
          <div class="modal-nav">
            <button class="btn-soft" id="prevCard">Prev</button>
            <button class="btn-soft" id="nextCard">Next</button>
            <button class="btn-soft" id="modalPng">PNG</button>
            <button class="btn-soft" id="modalPdf">PDF</button>
          </div>
        </aside>
      </div>
    </div>

    <div class="export-stage" id="exportStage"></div>
    <div class="toast" id="toast"></div>

    <script>
      /* Cheap DOM-id memoisation — el() is called very frequently across the
         app; the underlying node never changes for the life of the page. */
      const _elCache = Object.create(null);
      const el = (id) => _elCache[id] || (_elCache[id] = document.getElementById(id));

      const state = {
        payload: null,
        imageCache: new Map(),
        favourites: new Set(),
        activeIndex: 0,
        ageGroup: '3-4',
        pageSize: 0,
        page: 1,
        busy: false,
      };

      /* Card palettes, matched to the printed flash-card set. */
      const THEMES = [
        { frame: '#FFD233', ink: '#7a5900', tint: '#FFF6D5', dash: 'rgba(255,255,255,.92)', bubble: '#4C1D95' },
        { frame: '#FF3D8B', ink: '#8e0f43', tint: '#FFE6F0', dash: 'rgba(255,255,255,.92)', bubble: '#4C1D95' },
        { frame: '#4FC3F7', ink: '#0b5f83', tint: '#E4F6FE', dash: 'rgba(255,255,255,.95)', bubble: '#1D4ED8' },
        { frame: '#FF5A5F', ink: '#8c1f22', tint: '#FFE9E9', dash: 'rgba(255,255,255,.92)', bubble: '#4C1D95' },
        { frame: '#3DD68C', ink: '#0d6641', tint: '#E3FAEF', dash: 'rgba(255,255,255,.95)', bubble: '#0F766E' },
        { frame: '#A78BFA', ink: '#4a2ca0', tint: '#F1EBFF', dash: 'rgba(255,255,255,.95)', bubble: '#4C1D95' },
      ];

      const IMAGE_TYPES = new Set(['image', 'illustration', 'photo', 'asset']);

      /* ---------------- small helpers ---------------- */

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        })[ch]);
      }

      function svg(paths, size) {
        return (
          '<svg width="' + (size || 20) + '" height="' + (size || 20) +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'
        );
      }

      const ICONS = {
        heart: '<path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3Z" />',
        expand: '<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />',
        download: '<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16" />',
        file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Zm0 0v5h5" />',
        picture: '<rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9.5" r="1.6" /><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5" />',
        arrowL: '<path d="M19 12H5m0 0 6-6m-6 6 6 6" />',
        arrowR: '<path d="M5 12h14m0 0-6-6m6 6-6 6" />',
      };

      function defaultApiBase() {
        return location.protocol.startsWith('http') ? location.origin : 'http://localhost:3000';
      }

      function apiBase() {
        return (el('apiBase').value || defaultApiBase()).replace(/\/+$/, '');
      }

      async function configuredApiBase() {
        if (!location.protocol.startsWith('http')) return '';
        try {
          const response = await fetch('/api/config', { cache: 'no-store' });
          if (!response.ok) return '';
          const config = await response.json();
          return typeof config.apiBaseUrl === 'string' ? config.apiBaseUrl.trim().replace(/\/+$/, '') : '';
        } catch (error) {
          return '';
        }
      }

      function toast(html, ms = 2600) {
        const node = el('toast');
        node.innerHTML = html;
        node.classList.add('show');
        clearTimeout(node._t);
        node._t = setTimeout(() => node.classList.remove('show'), ms);
      }

      function showBanner(which, html) {
        const node = el(which === 'error' ? 'errorBanner' : 'warnBanner');
        node.innerHTML = html;
        node.classList.add('show');
      }

      function clearBanners() {
        el('errorBanner').classList.remove('show');
        el('warnBanner').classList.remove('show');
      }

      function slugify(text) {
        return (text || 'flashcard')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '')
          .slice(0, 40);
      }

      function setBusy(busy) {
        state.busy = busy;
        el('generateBtn').disabled = busy;
        el('downloadAllPdf').disabled = busy;
        el('downloadAllPng').disabled = busy;
      }

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      function hash(text) {
        let out = 0;
        for (let i = 0; i < (text || '').length; i += 1) {
          out = (out * 31 + text.charCodeAt(i)) % 100000;
        }
        return out;
      }

      function uuid() {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
        });
      }

      function humanize(text) {
        return String(text || '')
          .replace(/_/g, ' ')
          .replace(/\b\w/g, (ch) => ch.toUpperCase());
      }

      function componentTypeOf(component) {
        return (component.componentType || component.type || '').toLowerCase();
      }

      function componentIdOf(component) {
        return (component.componentId || component.id || '').toLowerCase();
      }

      function isImageCollection(component) {
        const type = componentTypeOf(component);
        const id = componentIdOf(component);
        return type === 'imagecollection' || id === 'objectgrid' || id === 'imagecollection';
      }

      function isImageComponent(component) {
        if (isImageCollection(component)) return false;
        const type = componentTypeOf(component);
        const id = componentIdOf(component);
        if (type === 'image' || IMAGE_TYPES.has(type)) return true;
        return ['leftimage', 'rightimage', 'image', 'illustration', 'photo'].includes(id);
      }

      function collectionItems(component) {
        return component.items || component.images || component.collection || component.assetReferences || [];
      }

      function contentFromComponent(component) {
        if (!component) return null;
        if (component.content != null && component.content !== '') return component.content;
        const list = component.options || component.chips || component.categories;
        if (Array.isArray(list) && list.length) {
          return list
            .map((entry) => {
              if (typeof entry === 'string') return entry;
              return entry.label || entry.text || entry.content || entry.value || '';
            })
            .filter(Boolean)
            .join(' · ');
        }
        return null;
      }

      /**
       * Best-effort conversion of a component's content into a list. The API
       * contract only guarantees `content: string | null`, so list-shaped
       * components (textCollection etc.) may arrive as JSON, a delimited
       * string, or (defensively) an already-parsed array.
       */
      function parseListContent(raw) {
        if (raw == null) return [];
        if (Array.isArray(raw)) return raw;
        const text = String(raw).trim();
        if (!text) return [];
        try {
          const parsed = JSON.parse(text);
          if (Array.isArray(parsed)) return parsed;
        } catch {
          /* not JSON — fall through to delimiter split */
        }
        return text
          .split(/\r?\n|\s*\|\s*|\s*,\s*/)
          .map((s) => s.trim())
          .filter(Boolean);
      }

      function collectImageRefs(component) {
        const refs = [];
        if (isImageCollection(component)) {
          for (const item of collectionItems(component)) {
            const ref = item.assetReference || (item.imageUrl || item.signedUrl ? item : null);
            if (ref) refs.push(ref);
          }
          return refs;
        }
        if (component.assetReference) refs.push(component.assetReference);
        return refs;
      }

      /* ---------------- API ---------------- */

      async function loadTemplates() {
        const select = el('templateSelect');
        const previous = select.value;
        select.innerHTML = '<option value="">Auto — no template selected</option>';
        select.disabled = true;

        try {
          const response = await fetch(apiBase() + '/flashcards/templates', {
            headers: {
              'x-trace-id': uuid(),
              'x-correlation-id': uuid(),
            },
          });
          const body = await response.json().catch(() => null);

          if (!response.ok) {
            console.warn('Failed to load templates:', response.status, body);
            return;
          }

          const fragment = document.createDocumentFragment();
          for (const tmpl of (body && body.templates) || []) {
            const option = document.createElement('option');
            option.value = tmpl.id;
            const parts = [tmpl.templateType, tmpl.layoutType].filter(Boolean);
            option.textContent = tmpl.name + (parts.length ? ' (' + parts.join(' · ') + ')' : '');
            fragment.appendChild(option);
          }
          select.appendChild(fragment);

          if (previous && Array.from(select.options).some((opt) => opt.value === previous)) {
            select.value = previous;
          }
        } catch (error) {
          console.warn('Could not load templates:', error.message);
        } finally {
          select.disabled = false;
        }
      }

      async function generate() {
        const query = el('query').value.trim();
        const ageGroup = state.ageGroup;
        const count = Number(el('count').value) || 5;
        const templateId = el('templateSelect').value;

        if (!query || !ageGroup) {
          showBanner('error', '<div>A learning topic and an age group are both required.</div>');
          return;
        }

        clearBanners();
        setBusy(true);
        renderSkeletons(count);

        try {
          const requestBody = { query, ageGroup, count };
          if (templateId) requestBody.templateId = templateId;

          const response = await fetch(apiBase() + '/flashcards/generate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-trace-id': uuid(),
              'x-correlation-id': uuid(),
            },
            body: JSON.stringify(requestBody),
          });

          const body = await response.json().catch(() => null);

          if (!response.ok) {
            const err = body && body.error ? body.error : null;
            showBanner(
              'error',
              '<div><b>' + escapeHtml(err ? err.code : 'HTTP ' + response.status) + '</b><br>' +
                escapeHtml(err ? err.message : (body && body.message) || response.statusText) +
                (err && err.details ? '<br><code>' + escapeHtml(JSON.stringify(err.details)) + '</code>' : '') +
                '</div>',
            );
            resetResults();
            return;
          }

          state.payload = body;
          state.imageCache.clear();
          state.favourites.clear();
          state.page = 1;
          await preloadImages(body);
          renderSummary(body);
          renderGrid();
        } catch (error) {
          resetResults();
          showBanner(
            'error',
            '<div><b>Could not reach the API</b><br>' + escapeHtml(error.message) +
              '<br><code>Check the API URL, that the server is running, and that CORS allows this origin.</code></div>',
          );
        } finally {
          setBusy(false);
        }
      }

      function resetResults() {
        el('grid').innerHTML = '';
        el('empty').style.display = 'block';
        el('summary').classList.remove('show');
        el('pager').innerHTML = '';
      }

      /**
       * Prefers the API's same-origin proxy path so neither display nor canvas
       * export depends on an S3 CORS rule. Falls back to the raw signed URL.
       */
      function imageSourceFor(ref) {
        if (!ref) return null;
        if (ref.imageUrl) {
          return ref.imageUrl.startsWith('http') ? ref.imageUrl : apiBase() + ref.imageUrl;
        }
        return ref.signedUrl || ref.url || null;
      }

      /**
       * Canvas export taints on cross-origin images, so sources are inlined as
       * data URLs up front wherever the response allows it.
       */
      async function preloadImages(payload) {
        const sources = new Set();
        for (const card of payload.cards || []) {
          for (const component of card.components || []) {
            for (const ref of collectImageRefs(component)) {
              const source = imageSourceFor(ref);
              if (source) sources.add(source);
            }
          }
        }

        let blocked = 0;
        await Promise.all(
          Array.from(sources).map(async (source) => {
            if (state.imageCache.has(source)) return;
            try {
              const response = await fetch(source, { mode: 'cors' });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const blob = await response.blob();
              const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              });
              state.imageCache.set(source, dataUrl);
            } catch {
              blocked += 1;
              state.imageCache.set(source, null);
            }
          }),
        );

        if (blocked > 0) {
          showBanner(
            'warn',
            '<div><b>' + blocked + ' image(s) could not be inlined.</b> They still display, but may be missing from PNG/PDF exports.</div>',
          );
        }
      }


      /* ---------------- rendering engine ---------------- */

      function layoutDefinitionOf(payload) {
        return (payload && payload.layoutDefinition) || (payload.template && payload.template.layoutDefinition) || null;
      }

      function layoutTypeOf(payload) {
        return ((payload.template && payload.template.layoutType) || 'VERTICAL').toUpperCase();
      }

      function buildComponentMap(card) {
        const map = new Map();
        for (const component of card.components || []) {
          const id = component.componentId || component.id;
          if (id) map.set(id, component);
        }
        return map;
      }

      function mergeComponentDef(def, data) {
        return {
          componentId: def.id || (data && data.componentId) || '',
          type: def.type || (data && (data.type || data.componentType)) || 'text',
          editable: def.editable != null ? def.editable : data && data.editable,
          required: def.required != null ? def.required : data && data.required,
          visible: def.visible != null ? def.visible : data ? data.visible : true,
          constraints: def.constraints || (data && data.constraints) || null,
          content: data ? contentFromComponent(data) : null,
          assetReference: data && data.assetReference,
          metadata: data && data.metadata,
          options: data && (data.options || data.choices),
          chips: data && (data.chips || data.categories),
          items: data && (data.items || data.images || data.collection || data.assetReferences),
          raw: data || null,
        };
      }

      function validateLayout(layoutDef, layoutType) {
        const issues = [];
        if (!layoutDef || !Array.isArray(layoutDef.regions) || !layoutDef.regions.length) {
          issues.push({ kind: 'missing_regions', message: 'layoutDefinition.regions is missing or empty' });
        }
        if (!LayoutFactory.has(layoutType)) {
          issues.push({ kind: 'unknown_layout', message: 'Unsupported layout type: ' + layoutType });
        }
        for (const region of (layoutDef && layoutDef.regions) || []) {
          for (const comp of region.components || []) {
            const type = (comp.type || '').toLowerCase();
            if (type && !ComponentFactory.has(type)) {
              issues.push({ kind: 'unknown_component', message: 'Unsupported component type: ' + type, componentId: comp.id });
            }
          }
        }
        return issues;
      }

      function renderPlaceholder(label, detail) {
        const node = document.createElement('div');
        node.className = 'comp-placeholder';
        node.textContent = label + (detail ? ': ' + detail : '');
        return node;
      }

      function applyRegionStyles(node, region) {
        if (!region) return;
        if (region.visibility === false || region.visible === false) {
          node.classList.add('hidden');
        }
        const styles = {};
        if (region.flex != null) styles.flex = region.flex;
        if (region.gap != null) styles.gap = typeof region.gap === 'number' ? region.gap + 'cqw' : region.gap;
        if (region.padding != null) styles.padding = typeof region.padding === 'number' ? region.padding + 'cqw' : region.padding;
        if (region.background) styles.background = region.background;
        if (region.border) styles.border = region.border;
        if (region.alignment) {
          const parts = String(region.alignment).split(/\s+/);
          if (parts[0]) styles.justifyContent = parts[0];
          if (parts[1]) styles.alignItems = parts[1];
          if (parts.length === 1) styles.alignItems = parts[0];
        }
        if (region.orientation === 'horizontal') node.style.flexDirection = 'row';
        if (region.orientation === 'vertical') node.style.flexDirection = 'column';
        Object.assign(node.style, styles);
      }

      function decorateHeaderRegion(regionNode) {
        regionNode.classList.add('uno-top');

        /* Any single text label in the header (ids vary by template — e.g.
           'subject' on most cards, 'skillLabel' on phonics cards) gets the
           standard category-pill styling. */
        const labelNode = regionNode.querySelector('[data-component-id]');
        let categoryText = '';
        if (labelNode) {
          labelNode.classList.add('uno-cat');
          categoryText = labelNode.textContent;
        }

        /* The brand mark is always synthesised here rather than rendered
           from a template-supplied image component (see renderRegion,
           which skips a 'brandingLogo' component definition), so every
           template gets an identical, dependency-free logo. */
        const logo = document.createElement('span');
        logo.className = 'uno-logo';
        logo.setAttribute('aria-hidden', 'true');
        const marks = /number|count|math|shape/i.test(categoryText) ? ['1', '2', '3'] : ['A', 'B', 'C'];
        logo.innerHTML = marks.map((m) => '<span>' + m + '</span>').join('');
        regionNode.appendChild(logo);
      }

      function decorateFooterRegion(regionNode) {
        regionNode.classList.add('uno-text');
      }

      function decorateBodyRegion(regionNode) {
        regionNode.classList.add('uno-main');
      }

      function applyRegionDecorations(regionNode, regionDef, ctx) {
        const regionId = (regionDef.id || '').toLowerCase();
        if (regionId === 'header') decorateHeaderRegion(regionNode, ctx);
        else if (regionId === 'body') decorateBodyRegion(regionNode);
        else if (regionId === 'footer' || regionId === 'bottom') decorateFooterRegion(regionNode);
      }

      function textClassForComponent(componentId, type) {
        const id = (componentId || '').toLowerCase();
        const compType = (type || '').toLowerCase();
        if (id === 'answerbox') return 'u-answerbox';
        if (
          ['letter', 'number', 'letterupper', 'letterlower'].includes(id) ||
          ['letter', 'number'].includes(compType)
        ) {
          return 'uno-hero';
        }
        if (id === 'subject' || id === 'skilllabel') return 'uno-cat';
        if (['title', 'word', 'caption', 'heading'].includes(id)) return 'u-caption';
        if (id === 'subtitle') return 'u-subtitle';
        if (['sentence', 'supportive_text', 'description', 'body'].includes(id)) return 'u-sentence';
        if (['phonics', 'pronunciation'].includes(id)) return 'u-pron';
        if (['fact', 'question', 'answer', 'tip'].includes(id)) return 'u-note';
        if (['badge', 'label'].includes(id) || compType === 'badge') return 'u-badge';
        if (id === 'footer') return 'u-footer';
        return 'u-sentence';
      }

      function isLongText(text, className) {
        if (className === 'uno-hero') return (text || '').length > 4;
        if (className === 'u-caption') return (text || '').length > 12;
        return false;
      }

      function makeEditable(node, component) {
        if (!component.editable) return;
        node.contentEditable = 'true';
        node.setAttribute('spellcheck', 'true');
        node.addEventListener('input', () => {
          if (component.raw) component.raw.content = node.textContent;
        });
      }

      function renderTextComponent(def, merged, ctx) {
        const className = textClassForComponent(merged.componentId, merged.type);
        const node = document.createElement('div');
        node.className = className + (isLongText(merged.content, className) ? ' long' : '');
        node.dataset.componentId = merged.componentId || '';

        if (className === 'u-answerbox') {
          /* Blank handwriting slot — must never be pre-filled, even if the
             API happened to send content for it. */
          makeEditable(node, merged);
          return node;
        }

        node.textContent = merged.content || '';
        if (className === 'u-note') {
          const id = (merged.componentId || '').toLowerCase();
          const type = (merged.type || '').toLowerCase();
          if (type === 'question' || id === 'question') node.classList.add('q');
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent =
            type === 'question' || id === 'question'
              ? 'Q'
              : type === 'answer' || id === 'answer'
                ? 'A'
                : type === 'tip' || id === 'tip'
                  ? 'Tip'
                  : 'Fact';
          const body = document.createElement('span');
          body.textContent = merged.content || '';
          node.textContent = '';
          node.append(tag, body);
        }
        if (!merged.content && merged.required) {
          node.textContent = '';
          node.classList.add('comp-placeholder');
        }
        makeEditable(node, merged);
        return node;
      }

      function renderImageComponent(def, merged, ctx) {
        return buildFigure(merged.raw || merged);
      }

      function renderImageCollectionComponent(def, merged, ctx) {
        const items = merged.items || collectionItems(merged.raw || {});
        const layoutType = layoutTypeOf(ctx.payload);
        const wrap = document.createElement('div');
        wrap.dataset.componentId = merged.componentId || '';

        if (layoutType === 'GRID') {
          wrap.className = 'uno-cells quad';
          items.slice(0, 4).forEach((item, index) => {
            const component = {
              componentId: (merged.componentId || 'image') + '_' + (index + 1),
              assetReference: item.assetReference || (item.imageUrl || item.signedUrl ? item : null),
              content: item.content || item.caption || null,
            };
            const caption = item.caption || item.content || item.label || '';
            wrap.appendChild(buildCell(component, caption));
          });
          return wrap;
        }

        if (layoutType === 'TWO_COLUMN') {
          wrap.className = 'uno-cells duo';
          items.slice(0, 2).forEach((item, index) => {
            const component = {
              componentId: (merged.componentId || 'image') + '_' + (index + 1),
              assetReference: item.assetReference || (item.imageUrl || item.signedUrl ? item : null),
              content: item.content || item.caption || null,
            };
            const caption = item.caption || item.content || item.label || '';
            wrap.appendChild(buildCell(component, caption));
          });
          return wrap;
        }

        wrap.className = 'uno-cells';
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '1.6cqw';
        items.forEach((item, index) => {
          const component = {
            componentId: (merged.componentId || 'image') + '_' + (index + 1),
            assetReference: item.assetReference || (item.imageUrl || item.signedUrl ? item : null),
            content: item.content || item.caption || null,
          };
          const cell = document.createElement('div');
          cell.className = 'uno-cell';
          cell.appendChild(buildFigure(component));
          const caption = item.caption || item.content || item.label || '';
          if (caption) {
            const label = document.createElement('div');
            label.className = 'cell-label';
            label.textContent = caption;
            cell.appendChild(label);
          }
          wrap.appendChild(cell);
        });
        return wrap;
      }

      function renderOptionsComponent(def, merged, ctx) {
        const list = merged.options || [];
        if (!list.length) {
          if (merged.content) return renderTextComponent(def, merged, ctx);
          return renderPlaceholder('Options', merged.componentId);
        }
        const wrap = document.createElement('div');
        wrap.className = 'comp-options';
        wrap.dataset.componentId = merged.componentId || '';
        list.forEach((entry, index) => {
          const row = document.createElement('div');
          row.className = 'comp-option';
          row.textContent =
            typeof entry === 'string'
              ? String.fromCharCode(65 + index) + '. ' + entry
              : (entry.label || entry.text || entry.content || entry.value || '');
          if (merged.editable) {
            row.contentEditable = 'true';
          }
          wrap.appendChild(row);
        });
        return wrap;
      }

      function renderChipsComponent(def, merged, ctx) {
        const list = merged.chips || (merged.raw && merged.raw.categories) || [];
        if (!list.length) {
          if (merged.content) return renderTextComponent(def, merged, ctx);
          return renderPlaceholder('Chips', merged.componentId);
        }
        const wrap = document.createElement('div');
        wrap.className = 'comp-chips';
        wrap.dataset.componentId = merged.componentId || '';
        list.forEach((entry) => {
          const chip = document.createElement('span');
          chip.className = 'comp-chip';
          chip.textContent = typeof entry === 'string' ? entry : entry.label || entry.text || entry.content || '';
          if (merged.editable) chip.contentEditable = 'true';
          wrap.appendChild(chip);
        });
        return wrap;
      }

      /**
       * Renders a `textCollection` component (e.g. digit/number-name pairs)
       * as a simple vertical list. If the definition declares `pairedWith`,
       * the paired collection's values are zipped in alongside — that paired
       * component is *not* rendered separately (see renderRegion).
       */
      function renderTextCollectionComponent(def, merged, ctx) {
        const primary = parseListContent(merged.content);
        if (!primary.length) return renderPlaceholder('List', merged.componentId);

        let paired = [];
        if (def.pairedWith) {
          const pairedData = ctx.componentMap.get(def.pairedWith);
          paired = parseListContent(pairedData && contentFromComponent(pairedData));
        }

        const wrap = document.createElement('div');
        wrap.className = 'uno-cells';
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '1cqw';
        wrap.style.overflow = 'hidden';
        wrap.dataset.componentId = merged.componentId || '';

        primary.forEach((value, index) => {
          const row = document.createElement('div');
          row.className = 'u-sentence';
          row.textContent = paired[index] != null ? value + ' — ' + paired[index] : String(value);
          wrap.appendChild(row);
        });
        return wrap;
      }

      const ComponentFactory = (() => {
        const registry = new Map();

        function register(type, renderer) {
          registry.set(String(type).toLowerCase(), renderer);
        }

        function has(type) {
          return registry.has(String(type || '').toLowerCase());
        }

        function render(def, data, ctx) {
          const merged = mergeComponentDef(def, data);
          if (merged.visible === false) return null;
          const type = (def.type || '').toLowerCase();
          const renderer = registry.get(type);
          if (!renderer) {
            return renderPlaceholder('Unsupported Component', type || def.id);
          }
          if (
            merged.required &&
            !merged.content &&
            !merged.assetReference &&
            !(merged.items && merged.items.length) &&
            type !== 'text' /* answer-box style blanks are required-but-empty by design */
          ) {
            const placeholder = renderPlaceholder('Required', def.id);
            placeholder.dataset.componentId = def.id || '';
            return placeholder;
          }
          return renderer(def, merged, ctx);
        }

        register('text', renderTextComponent);
        register('image', renderImageComponent);
        register('imagecollection', renderImageCollectionComponent);
        register('textcollection', renderTextCollectionComponent);
        register('options', renderOptionsComponent);
        register('chips', renderChipsComponent);
        register('number', (def, merged, ctx) => renderTextComponent(def, { ...merged, componentId: merged.componentId || 'number' }, ctx));
        register('letter', (def, merged, ctx) => renderTextComponent(def, { ...merged, componentId: merged.componentId || 'letter' }, ctx));
        register('badge', (def, merged, ctx) => renderTextComponent(def, { ...merged, componentId: merged.componentId || 'badge', type: 'badge' }, ctx));

        return { register, has, render };
      })();

      /** Builds a single `.uno-cell` (figure + label) from a region's raw
       * component definitions. Shared by the four-quadrant layout and the
       * generalised two-column pair-list fallback so both stay in sync. */
      function renderCellFromRegionComponents(components, ctx) {
        const cell = document.createElement('div');
        cell.className = 'uno-cell';
        for (const compDef of components || []) {
          const type = (compDef.type || '').toLowerCase();
          const data = ctx.componentMap.get(compDef.id);
          const merged = mergeComponentDef(compDef, data);
          if (merged.visible === false) continue;
          if (type === 'image') {
            cell.appendChild(renderImageComponent(compDef, merged, ctx));
          } else {
            const label = document.createElement('div');
            label.className = 'cell-label';
            label.dataset.componentId = merged.componentId || '';
            label.textContent = merged.content || '';
            cell.appendChild(label);
          }
        }
        return cell;
      }

      function renderRegion(regionDef, ctx) {
        const regionNode = document.createElement('div');
        regionNode.className = 'layout-region';
        regionNode.dataset.regionId = regionDef.id || '';
        applyRegionStyles(regionNode, regionDef);

        /* Components consumed inline by a sibling (paired collections, the
           synthesised brand logo) are skipped here so they aren't rendered
           twice. */
        const pairedTargets = new Set(
          (regionDef.components || []).map((c) => c.pairedWith).filter(Boolean),
        );

        for (const compDef of regionDef.components || []) {
          const id = (compDef.id || '').toLowerCase();
          if (id === 'brandinglogo') continue;
          if (pairedTargets.has(compDef.id)) continue;
          const data = ctx.componentMap.get(compDef.id);
          const node = ComponentFactory.render(compDef, data, ctx);
          if (node) regionNode.appendChild(node);
        }

        applyRegionDecorations(regionNode, regionDef, ctx);
        return regionNode;
      }

      function groupRegions(regions) {
        const byId = new Map();
        const order = [];
        for (const region of regions) {
          byId.set(region.id, region);
          order.push(region.id);
        }
        return { byId, order, all: regions };
      }

      function verticalLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical';
        for (const region of layoutDef.regions || []) {
          root.appendChild(renderRegion(region, ctx));
        }
        return root;
      }

      function horizontalLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-horizontal horizontal';
        for (const region of layoutDef.regions || []) {
          root.appendChild(renderRegion(region, ctx));
        }
        return root;
      }

      /**
       * Handles two distinct TWO_COLUMN shapes:
       *  - a single left/right split (compare-style templates), or
       *  - a stacked list of paired rows, one per region (matching-pairs
       *    style templates), each row rendered image-cell + label-cell.
       */
      function twoColumnLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-two-column';
        const grouped = groupRegions(layoutDef.regions || []);
        const left = grouped.byId.get('left');
        const right = grouped.byId.get('right');

        if (left || right) {
          const row = document.createElement('div');
          row.className = 'layout-row uno-cells duo';
          if (left) row.appendChild(renderRegion(left, ctx));
          if (right) row.appendChild(renderRegion(right, ctx));
          if (row.childNodes.length) root.appendChild(row);
          for (const region of layoutDef.regions || []) {
            if (region.id === 'left' || region.id === 'right') continue;
            root.appendChild(renderRegion(region, ctx));
          }
          return root;
        }

        const list = document.createElement('div');
        list.className = 'uno-cells layout-pair-list';
        for (const region of layoutDef.regions || []) {
          const row = document.createElement('div');
          row.className = 'uno-cells duo layout-pair-row';
          row.appendChild(renderCellFromRegionComponents(region.components, ctx));
          list.appendChild(row);
        }
        root.appendChild(list);
        return root;
      }

      function gridLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-grid';
        for (const region of layoutDef.regions || []) {
          const regionNode = renderRegion(region, ctx);
          if ((region.id || '').toLowerCase() === 'body') {
            const main = document.createElement('div');
            main.className = 'uno-main';
            main.appendChild(regionNode);
            root.appendChild(main);
          } else {
            root.appendChild(regionNode);
          }
        }
        return root;
      }

      /**
       * 2-column-by-3-row sequence grid: alphabet / number sequences and
       * sight-word grids. Every text component in a non-'instruction' region
       * becomes one grid cell; an empty value renders as a dashed blank.
       */
      function grid2x3Layout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-grid-2x3';
        const grouped = groupRegions(layoutDef.regions || []);

        for (const region of layoutDef.regions || []) {
          if (region.id === 'instruction') continue;
          const main = document.createElement('div');
          main.className = 'uno-main';
          const grid = document.createElement('div');
          grid.className = 'grid-2x3';
          for (const compDef of region.components || []) {
            const data = ctx.componentMap.get(compDef.id);
            const merged = mergeComponentDef(compDef, data);
            if (merged.visible === false) continue;
            const cell = document.createElement('div');
            cell.className = 'grid-2x3-cell' + (merged.content ? '' : ' blank');
            cell.dataset.componentId = merged.componentId || '';
            cell.textContent = merged.content || '_';
            grid.appendChild(cell);
          }
          main.appendChild(grid);
          root.appendChild(main);
        }

        const instruction = grouped.byId.get('instruction');
        if (instruction) root.appendChild(renderRegion(instruction, ctx));

        return root;
      }

      /**
       * Four quadrants of image+label around a central highlighted bubble
       * (e.g. the phonics blend cards: four example words around the
       * target sound). Region ids: header, topLeft, topRight, bottomLeft,
       * bottomRight, center.
       */
      function fourQuadrantLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-four-quadrant';
        const grouped = groupRegions(layoutDef.regions || []);
        const quadrantIds = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'];
        const consumedIds = new Set(['header', 'center', ...quadrantIds]);

        const header = grouped.byId.get('header');
        if (header) root.appendChild(renderRegion(header, ctx));

        const body = document.createElement('div');
        body.className = 'uno-main';

        const quadWrap = document.createElement('div');
        quadWrap.className = 'uno-cells quad';
        for (const id of quadrantIds) {
          const region = grouped.byId.get(id);
          if (!region) continue;
          quadWrap.appendChild(renderCellFromRegionComponents(region.components, ctx));
        }
        body.appendChild(quadWrap);

        const center = grouped.byId.get('center');
        if (center) {
          const bubble = document.createElement('div');
          bubble.className = 'uno-bubble';
          for (const compDef of center.components || []) {
            const data = ctx.componentMap.get(compDef.id);
            const merged = mergeComponentDef(compDef, data);
            if (merged.visible === false) continue;
            bubble.dataset.componentId = merged.componentId || '';
            bubble.textContent = merged.content || '';
          }
          body.appendChild(bubble);
        }

        root.appendChild(body);

        for (const region of layoutDef.regions || []) {
          if (consumedIds.has(region.id)) continue;
          root.appendChild(renderRegion(region, ctx));
        }

        return root;
      }

      function splitLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-split';
        const splitIds = new Set(['left', 'right', 'top', 'bottom']);
        const split = document.createElement('div');
        split.className = 'layout-split';
        for (const region of layoutDef.regions || []) {
          if (splitIds.has(region.id)) split.appendChild(renderRegion(region, ctx));
        }
        if (split.childNodes.length) root.appendChild(split);
        for (const region of layoutDef.regions || []) {
          if (!splitIds.has(region.id)) root.appendChild(renderRegion(region, ctx));
        }
        return root;
      }

      function overlayLayout(layoutDef, ctx) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical layout-overlay';
        for (const region of layoutDef.regions || []) {
          const regionNode = renderRegion(region, ctx);
          const regionId = (region.id || '').toLowerCase();
          if (regionId === 'overlay') {
            const bubble = regionNode.querySelector('.uno-hero, .u-caption, [data-component-id]');
            if (bubble) bubble.classList.add('uno-bubble');
          }
          root.appendChild(regionNode);
        }
        return root;
      }

      function unsupportedLayout(layoutDef, ctx, layoutType) {
        const root = document.createElement('div');
        root.className = 'layout-root layout-vertical';
        root.appendChild(renderPlaceholder('Unsupported Layout', layoutType));
        for (const region of (layoutDef && layoutDef.regions) || []) {
          root.appendChild(renderRegion(region, ctx));
        }
        return root;
      }

      const LayoutFactory = (() => {
        const registry = new Map();

        function register(type, renderer) {
          registry.set(String(type).toUpperCase(), renderer);
        }

        function has(type) {
          return registry.has(String(type || 'VERTICAL').toUpperCase());
        }

        function render(layoutType, layoutDef, card, ctx) {
          const type = String(layoutType || 'VERTICAL').toUpperCase();
          const renderer = registry.get(type);
          if (!renderer) return unsupportedLayout(layoutDef, ctx, type);
          return renderer(layoutDef, ctx);
        }

        register('VERTICAL', verticalLayout);
        register('HORIZONTAL', horizontalLayout);
        register('TWO_COLUMN', twoColumnLayout);
        register('GRID', gridLayout);
        register('GRID_2X3', grid2x3Layout);
        register('FOUR_QUADRANT_CENTER', fourQuadrantLayout);
        register('STACKED', verticalLayout);
        register('SPLIT', splitLayout);
        register('OVERLAY', overlayLayout);

        return { register, has, render };
      })();

      function buildRenderContext(card, payload, theme) {
        return {
          card,
          payload,
          theme,
          componentMap: buildComponentMap(card),
        };
      }

      function categoryFallback(payload) {
        const template = payload.template || {};
        const request = payload.request || {};
        return (
          template.description ||
          humanize(template.templateType) ||
          template.name ||
          humanize(request.learningObjective) ||
          'Flash Card'
        );
      }
